<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 4 – Advanced Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <h2>Cognifyz</h2>
    <div>
      <button onclick="navigate('home')">Home</button>
      <button onclick="navigate('register')">Register</button>
    </div>
  </nav>

  <!-- HOME PAGE -->
  <section id="home" class="page active">
    <div class="card">
      <h1>Welcome 👋</h1>
      <p>Create your account with advanced validation and smooth UI.</p>
      <button class="primary" onclick="navigate('register')">
        Get Started
      </button>
    </div>
  </section>

  <!-- REGISTER PAGE -->
  <section id="register" class="page">
    <div class="card">
      <h2>Register</h2>

      <form id="registerForm">
        <label>Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Strong password" required>
        <small id="passwordMsg"></small>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter password" required>

        <button class="primary" type="submit">Register</button>
      </form>

      <div id="successMsg"></div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
